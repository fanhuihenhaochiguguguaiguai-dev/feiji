name: Android APK V11
on:
  push:
    branches: [build/android-v11-91930f9]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91930f9fb8fc6a0f57cc5780622d6527069994f3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android wrapper
        run: |
          test -s dist/index.html
          npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.cangqiong.frontline","appName":"苍穹锋刃","webDir":"dist","server":{"androidScheme":"https"}}
          EOF
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:screenOrientation="sensorLandscape"')
          p.write_text(s)
          p=Path('android/app/build.gradle')
          s=p.read_text().replace('versionCode 1','versionCode 110000').replace('versionName "1.0"','versionName "11.0.0"')
          p.write_text(s)
          p=next(Path('android/app/src/main/java').rglob('MainActivity.java'))
          p.write_text('''package com.cangqiong.frontline;
          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              getWindow().getDecorView().setSystemUiVisibility(5894);
            }
            @Override public void onWindowFocusChanged(boolean focus) {
              super.onWindowFocusChanged(focus);
              if (focus) getWindow().getDecorView().setSystemUiVisibility(5894);
            }
          }
          ''')
          PY
          npx cap sync android
      - name: Build and sign debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify and prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Cangqiong-V11-91930f9.apk
          tool="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$tool" verify --verbose output/Cangqiong-V11-91930f9.apk
          unzip -tq output/Cangqiong-V11-91930f9.apk
          sha256sum output/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cangqiong-V11-APK
          path: output/*.apk
          if-no-files-found: error
