name: Build V16 Android APK
on:
  push:
    branches: [apk/v16-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V16 release
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json');if(p.version!=='16.0.0')throw Error('Not V16: '+p.version)"
          test -s dist/index.html
          test -d dist/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate offline Android WebView wrapper and build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .android-v16-build/app/src/main/java/com/cangqiong/fengren/v16
          mkdir -p .android-v16-build/app/src/main/assets/www
          cp -a dist/. .android-v16-build/app/src/main/assets/www/
          cat > .android-v16-build/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'CangqiongV16'
          include ':app'
          EOF
          cat > .android-v16-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > .android-v16-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > .android-v16-build/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.cangqiong.fengren.v16'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.cangqiong.fengren.v16'
                  minSdk 26
                  targetSdk 34
                  versionCode 16
                  versionName '16.0.0'
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF
          cat > .android-v16-build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="苍穹锋刃 V16"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="screenSize|orientation|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > .android-v16-build/app/src/main/java/com/cangqiong/fengren/v16/MainActivity.java <<'EOF'
          package com.cangqiong.fengren.v16;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends Activity {
              private WebView game;
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
                  WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/", new WebViewAssetLoader.AssetsPathHandler(this,"www"))
                      .build();
                  game = new WebView(this);
                  game.setBackgroundColor(0xFF0A1220);
                  game.getSettings().setJavaScriptEnabled(true);
                  game.getSettings().setDomStorageEnabled(true);
                  game.getSettings().setAllowFileAccess(false);
                  game.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  game.setWebChromeClient(new WebChromeClient());
                  game.setWebViewClient(new WebViewClientCompat() {
                      @Override public WebResourceResponse shouldInterceptRequest(
                          WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }
                  });
                  setContentView(game);
                  game.loadUrl("https://appassets.androidplatform.net/index.html");
              }
              @Override protected void onDestroy() {
                  if(game != null) { game.destroy(); game = null; }
                  super.onDestroy();
              }
          }
          EOF
          gradle -p .android-v16-build --no-daemon :app:assembleDebug
          mkdir -p artifacts
          cp .android-v16-build/app/build/outputs/apk/debug/app-debug.apk artifacts/Cangqiong_Fengren_V16.apk
          test -s artifacts/Cangqiong_Fengren_V16.apk
          sha256sum artifacts/Cangqiong_Fengren_V16.apk
          du -h artifacts/Cangqiong_Fengren_V16.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cangqiong_Fengren_V16_APK
          path: artifacts/Cangqiong_Fengren_V16.apk
          if-no-files-found: error
          retention-days: 7
