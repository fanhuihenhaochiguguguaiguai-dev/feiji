name: V18.3 native Android

on:
  push:
    branches: [v18.3-native]
  workflow_dispatch:
    inputs:
      debug_build:
        description: Build a Debug APK for troubleshooting
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GODOT_VERSION: 4.7.2
      GODOT_RELEASE: 4.7.2-stable
      NDK_VERSION: 29.0.14206865
      CUSTOM_RELEASE: ${{ !inputs.debug_build }}
    steps:
      - name: Set workspace-local Godot paths
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/sky-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/sky-data" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/sky-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdk_manager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" --licenses < <(yes) > "$RUNNER_TEMP/android-licenses.log"
          "$sdk_manager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install Godot editor and export template
        run: |
          url="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          curl --fail --retry 3 -sSL "$url/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --retry 3 -sSL "$url/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/bin/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          dest="$XDG_DATA_HOME/godot/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$dest" android/build
          unzip -qj "$RUNNER_TEMP/templates.tpz" 'templates/android_*.apk' 'templates/android_source.zip' -d "$dest"
          unzip -q "$dest/android_source.zip" -d android/build
          printf '%s\n' "$GODOT_VERSION.stable" > android/.build_version
          touch android/build/.gdignore
      - name: Native extension and tests
        run: |
          tools/build_extension.sh
          godot --headless --editor --import
          godot --headless --script res://qa/smoke.gd
          godot --headless --script res://qa/v182.gd
          godot --headless --script res://qa/refinement.gd
          godot --headless --script res://qa/campaign.gd
          godot --headless --script res://qa/missile.gd
          godot --headless --script res://qa/fleet_assets.gd
          godot --headless --script res://qa/world_coverage.gd
      - name: Gradle export and signature verification
        if: env.CUSTOM_RELEASE != 'true'
        env:
          SKYBLADE_ANDROID_KEYSTORE_B64: ${{ secrets.SKYBLADE_ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p "$XDG_CONFIG_HOME/godot" dist
          if [[ -n "$SKYBLADE_ANDROID_KEYSTORE_B64" ]]; then
            printf '%s' "$SKYBLADE_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
          else
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -dname 'CN=Sky Blade CI' -validity 3650
          fi
          cat > "$XDG_CONFIG_HOME/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's|gradle_build/use_gradle_build=false|gradle_build/use_gradle_build=true|' export_presets.cfg
          godot --headless --export-debug 'Android ARM64' dist/skyblade-v18.3-arm64.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose dist/skyblade-v18.3-arm64.apk
          unzip -l dist/skyblade-v18.3-arm64.apk | grep 'lib/arm64-v8a/libskyterrain'
          unzip -l dist/skyblade-v18.3-arm64.apk | grep 'lib/arm64-v8a/libterrain'
      - uses: actions/upload-artifact@v4
        if: env.CUSTOM_RELEASE != 'true'
        with:
          name: skyblade-v18.3-arm64-debug
          path: dist/skyblade-v18.3-arm64.apk
          if-no-files-found: error
      - name: Cache custom release template
        if: env.CUSTOM_RELEASE == 'true'
        id: release_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sky-release-template
          key: godot-4.7.2-android-arm64-ndk29-thinlto-${{ hashFiles('tools/release/mobile-release.gdbuild') }}
      - name: Compile Godot release from the pinned source
        if: env.CUSTOM_RELEASE == 'true' && steps.release_cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/sky-scons"
          "$RUNNER_TEMP/sky-scons/bin/pip" install scons==4.9.1
          export PATH="$RUNNER_TEMP/sky-scons/bin:$PATH"
          git clone --depth 1 --branch "$GODOT_RELEASE" https://github.com/godotengine/godot.git "$RUNNER_TEMP/godot-source"
          cd "$RUNNER_TEMP/godot-source"
          python3 misc/scripts/install_swappy_android.py
          scons -j"$(nproc)" platform=android target=template_release arch=arm64 production=yes lto=thin optimize=size generate_android_binaries=yes build_profile="$GITHUB_WORKSPACE/tools/release/mobile-release.gdbuild"
          mkdir -p "$RUNNER_TEMP/sky-release-template"
          cp bin/android_release.apk "$RUNNER_TEMP/sky-release-template/android_release.apk"
      - name: Verify and compare signed release APKs
        if: env.CUSTOM_RELEASE == 'true'
        env:
          SKYBLADE_ANDROID_KEYSTORE_B64: ${{ secrets.SKYBLADE_ANDROID_KEYSTORE_B64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p "$XDG_CONFIG_HOME/godot" dist
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/sky-release.keystore"
          if [[ -n "$SKYBLADE_ANDROID_KEYSTORE_B64" ]]; then
            printf '%s' "$SKYBLADE_ANDROID_KEYSTORE_B64" | base64 --decode > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          else
            keytool -genkeypair -noprompt -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Sky Blade CI Release Test' -keyalg RSA -validity 3650
          fi
          cat > "$XDG_CONFIG_HOME/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
          stock="$RUNNER_TEMP/skyblade-stock-release.apk"
          template="$RUNNER_TEMP/sky-release-template/android_release.apk"
          godot --headless --export-release 'Android ARM64' "$stock"
          sed -i "/^\[preset.0.options\]$/a custom_template/release=\"$template\"" export_presets.cfg
          godot --headless --export-release 'Android ARM64' dist/skyblade-v18.3-arm64.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/skyblade-v18.3-arm64.apk > dist/signature.txt
          python3 tools/release/check_release.py "$stock" dist/skyblade-v18.3-arm64.apk "$template" > dist/build-comparison.json
      - uses: actions/upload-artifact@v4
        if: env.CUSTOM_RELEASE == 'true'
        with:
          name: skyblade-v18.3-arm64-release
          path: |
            dist/skyblade-v18.3-arm64.apk
            dist/signature.txt
            dist/build-comparison.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && env.CUSTOM_RELEASE == 'true'
        with:
          name: skyblade-v18.3-engine-template
          path: ${{ runner.temp }}/sky-release-template/android_release.apk
          if-no-files-found: error
