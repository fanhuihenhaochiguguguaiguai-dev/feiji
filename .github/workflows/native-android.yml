name: V18.2 native Android

on:
  push:
    branches: [v18.2-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.7.2
      GODOT_RELEASE: 4.7.2-stable
      NDK_VERSION: 29.0.14206865
    steps:
      - name: Set workspace-local Godot paths
        run: |
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/sky-config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/sky-data" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/sky-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdk_manager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" --licenses < <(yes) > "$RUNNER_TEMP/android-licenses.log"
          "$sdk_manager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install Godot editor and export template
        run: |
          url="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          curl --fail --retry 3 -sSL "$url/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --retry 3 -sSL "$url/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/bin/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          dest="$XDG_DATA_HOME/godot/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$dest" android/build
          unzip -qj "$RUNNER_TEMP/templates.tpz" 'templates/android_*.apk' 'templates/android_source.zip' -d "$dest"
          unzip -q "$dest/android_source.zip" -d android/build
          printf '%s\n' "$GODOT_VERSION.stable" > android/.build_version
          touch android/build/.gdignore
      - name: Native extension and tests
        run: |
          tools/build_extension.sh
          godot --headless --editor --import
          godot --headless --script res://qa/smoke.gd
          godot --headless --script res://qa/v182.gd
      - name: Gradle export and signature verification
        env:
          SKYBLADE_ANDROID_KEYSTORE_B64: ${{ secrets.SKYBLADE_ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p "$XDG_CONFIG_HOME/godot" dist
          if [[ -n "$SKYBLADE_ANDROID_KEYSTORE_B64" ]]; then
            printf '%s' "$SKYBLADE_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
          else
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -dname 'CN=Sky Blade CI' -validity 3650
          fi
          cat > "$XDG_CONFIG_HOME/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's|gradle_build/use_gradle_build=false|gradle_build/use_gradle_build=true|' export_presets.cfg
          godot --headless --export-debug 'Android ARM64' dist/skyblade-v18.2-arm64.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose dist/skyblade-v18.2-arm64.apk
          unzip -l dist/skyblade-v18.2-arm64.apk | grep 'lib/arm64-v8a/libskyterrain'
          unzip -l dist/skyblade-v18.2-arm64.apk | grep 'lib/arm64-v8a/libterrain'
      - uses: actions/upload-artifact@v4
        with:
          name: skyblade-v18.2-arm64-debug
          path: dist/skyblade-v18.2-arm64.apk
          if-no-files-found: error
